<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fatis Palate | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 20px;
    }

    h1 {
      margin-top: 0;
      font-family: Georgia, serif;
      color: #d8bd7b;
    }

    p {
      color: #999;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d8bd7b;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #d8bd7b;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    .error {
      display: block !important;
      background: #351414;
      color: #ff9c9c;
    }

    .success {
      display: block !important;
      background: #14351d;
      color: #9cffb0;
    }

    #dashboard {
      display: none;
      width: 100%;
      max-width: 1000px;
    }

    .dashboard-box {
      background: #151515;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 30px;
    }

    .logout {
      width: auto;
      padding: 12px 20px;
      margin-top: 15px;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div
    id="loginBox"
    class="login-box"
  >

    <h1>Fatis Palate</h1>

    <p>
      Admin Dashboard
    </p>

    <form id="loginForm">

      <label for="email">
        Admin Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="admin@example.com"
        autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        type="submit"
      >
        Log In
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- DASHBOARD -->

  <div
    id="dashboard"
  >

    <div class="dashboard-box">

      <h1>
        Fatis Palate Admin
      </h1>

      <p>
        You are successfully logged in as an administrator.
      </p>

      <p id="adminEmail"></p>

      <button
        id="logoutButton"
        class="logout"
      >
        Log Out
      </button>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
    from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc
    }
    from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


    import {
      firebaseConfig
    }
    from
    "../firebase/firebase-config.js";


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    const loginBox =
      document.getElementById("loginBox");


    const dashboard =
      document.getElementById("dashboard");


    const loginForm =
      document.getElementById("loginForm");


    const emailInput =
      document.getElementById("email");


    const passwordInput =
      document.getElementById("password");


    const loginButton =
      document.getElementById("loginButton");


    const message =
      document.getElementById("message");


    const adminEmail =
      document.getElementById("adminEmail");


    const logoutButton =
      document.getElementById("logoutButton");


    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className = type;

    }


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter both your admin email and password."
          );

          return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          const adminDoc =
            await getDoc(
              doc(
                db,
                "admins",
                user.uid
              )
            );


          if (
            !adminDoc.exists()
          ) {

            await signOut(auth);

            showMessage(
              "This account is not registered as a Fatis Palate administrator."
            );

            return;

          }


          const adminData =
            adminDoc.data();


          if (
            adminData.role !== "admin"
          ) {

            await signOut(auth);

            showMessage(
              "This account does not have administrator permission."
            );

            return;

          }


          showMessage(
            "Login successful.",
            "success"
          );


          loginBox.style.display =
            "none";


          dashboard.style.display =
            "block";


          adminEmail.textContent =
            `Signed in as: ${user.email}`;

        } catch (error) {

          console.error(error);

          let errorMessage =
            "Login failed.";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            errorMessage =
              "Incorrect admin email or password.";

          }

          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            errorMessage =
              "No Firebase account exists with this email.";

          }

          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            errorMessage =
              "The password is incorrect.";

          }

          else if (
            error.code ===
            "auth/invalid-api-key"
          ) {

            errorMessage =
              "Firebase API key is invalid. Check firebase-config.js.";

          }

          else if (
            error.code ===
            "auth/unauthorized-domain"
          ) {

            errorMessage =
              "This Vercel domain is not authorized in Firebase Authentication.";

          }

          else {

            errorMessage =
              `${error.code || "Error"}: ${error.message || "Unknown error"}`;

          }


          showMessage(
            errorMessage
          );

        }

        finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            "Log In";

        }

      }
    );


    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

        dashboard.style.display =
          "none";

        loginBox.style.display =
          "block";

        emailInput.value = "";

        passwordInput.value = "";

        message.className = "";

        message.textContent = "";

      }
    );


    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {
          return;
        }

        try {

          const adminDoc =
            await getDoc(
              doc(
                db,
                "admins",
                user.uid
              )
            );


          if (
            adminDoc.exists() &&
            adminDoc.data().role === "admin"
          ) {

            loginBox.style.display =
              "none";

            dashboard.style.display =
              "block";

            adminEmail.textContent =
              `Signed in as: ${user.email}`;

          }

        } catch (error) {

          console.error(
            "Admin check error:",
            error
          );

        }

      }
    );

  </script>

</body>
</html>
